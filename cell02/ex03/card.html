<!DOCTYPE html>
<html>
<head>
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <h2>User Profile Card</h2>

    <div class="card">
        
        <img src="https://i.pinimg.com/736x/38/95/3f/38953fd7ca9728fa9bdc9f0204841f0b.jpg" alt="Profile" class="profile-img">

        <table class="invisible-table">
            
            <tr>
                <td colspan="3">
                    <h3 class="login-name">tanboonp (Pleng)</h3>
                </td>
            </tr>
            
            <tr>
                <td colspan="3" class="desc">
                    Student at 42bangkok
                </td>
            </tr>
            
            <tr>
                <td><img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub" class="social-icon"></td>
                <td><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram" class="social-icon"></td>
                <td><img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook" class="social-icon"></td>
            </tr>
            
        </table>

        <a href="#">
            <button class="contact-btn">Contact</button>
        </a>
        
    </div>

</body>
</html>
