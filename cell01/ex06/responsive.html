<!DOCTYPE html>
<html>
<head>
    <title>Responsive Table</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        
        td {
            border: 1px solid black;
            width: 50%;
            text-align: center;
        }
        
        .box-left {
            background-color: rgb(95, 0, 124);
            color: rgb(160, 255, 131);
        }
        
        .box-right {
            background-color: rgb(21, 255, 0);
            color: rgb(234, 0, 255);
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="box-left">Green</td>
            <td class="box-right">Purple</td>
        </tr>
    </table>

</body>
</html>
